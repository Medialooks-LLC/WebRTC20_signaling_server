workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never
  auto_cancel:
    on_new_commit: none

variables:
  GIT_DEPTH: "0"
  GITHUB_REPOSITORY: "Medialooks-LLC/WebRTC20_signaling_server"
  PUBLISH_GHCR: "false"
  RELEASE_RUNNER_TAG: "plant01"

stages: [release]

# Hold this lock until BOTH downstream levels finish. Preflight must run inside
# the lock, otherwise two pipelines could generate builds for the same SHA.
release_lane:
  stage: release
  resource_group: github-release
  interruptible: false
  trigger:
    include:
      - local: ci/release/coordinator.yml
    strategy: mirror
    forward:
      yaml_variables: true
      pipeline_variables: true
