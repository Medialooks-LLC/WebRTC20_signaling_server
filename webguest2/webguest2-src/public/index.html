<!DOCTYPE html>
<!-- "lobby-active" keeps the app root hidden until the pre-join lobby (src/lobby) is done. -->
<html lang="en" class="lobby-active">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="Join the live session right in your browser - no installs. Check your camera and microphone before you join." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Link previews (Telegram, WhatsApp, Slack, Teams...) read these tags; crawlers don't run JS. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Medialooks Meet" />
    <meta property="og:title" content="Join the live session - Medialooks Meet" />
    <meta property="og:description" content="Right in your browser - no installs. Check your camera and microphone before you join." />
    <meta property="og:image" content="https://meet.medialooks.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Join the live session - Medialooks Meet" />
    <meta name="twitter:description" content="Right in your browser - no installs." />
    <meta name="twitter:image" content="https://meet.medialooks.com/og-image.png" />
    <title>Medialooks Meet</title>
    <script src="%PUBLIC_URL%/runtime-config.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script src="%PUBLIC_URL%/adapter-latest.js"></script>
  </body>
</html>
