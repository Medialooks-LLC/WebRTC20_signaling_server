stages: [preflight, dispatch]

preflight:
  stage: preflight
  tags: [linux, shell, "$RELEASE_RUNNER_TAG"]
  interruptible: false
  script:
    - python3 -B -m unittest discover -s ci/release -p 'test_*.py'
    - python3 ci/release/release.py preflight --output generated-release.yml
  artifacts:
    paths: [generated-release.yml]
    expire_in: 1 day

dispatch:
  stage: dispatch
  trigger:
    include:
      - artifact: generated-release.yml
        job: preflight
    strategy: mirror
    forward:
      yaml_variables: true
      pipeline_variables: true
