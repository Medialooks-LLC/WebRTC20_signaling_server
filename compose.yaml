name: webrtc20
services:
  webrtc:
    image: ${WEBRTC_IMAGE:-webrtc20-signaling-server:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${WEBRTC_VERSION:-dev}
        VCS_REF: ${WEBRTC_VCS_REF:-unknown}
    ports:
      - "${WEBRTC_BIND_ADDRESS:-127.0.0.1}:${WEBRTC_HTTP_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      TLS_PORT: "8443"
      SDK_SIGNALING_URL: ${SDK_SIGNALING_URL:-}
      TURN_SERVERS: ${TURN_SERVERS:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
